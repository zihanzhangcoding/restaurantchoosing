<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>今天吃什么 · 去哪玩</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 主题色变量（默认=吃什么 暖色奶油） */
    :root{
      --bg1:#fdf8ee; --bg2:#f8edd6; --card:#fffdf7; --cardBorder:rgba(180,150,90,.14);
      --pillBg:#f1e5c8; --pillFg:#93804f; --primary:#3b4354; --inputBg:#f7efdd;
      --numBg:#e7d9b6; --numFg:#8a7743; --panel:#fffdf7;
    }
    /* 去哪玩 = 浅蓝色系 */
    body.theme-blue{
      --bg1:#eef6fd; --bg2:#d9e9fb; --card:#fbfdff; --cardBorder:rgba(90,140,190,.18);
      --pillBg:#d8e8f7; --pillFg:#4d6f92; --primary:#3a5a80; --inputBg:#e8f1fb;
      --numBg:#cfe0f2; --numFg:#3f6289; --panel:#fbfdff;
    }
    :root{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    html{ background:var(--bg1); }
    html,body{
      margin:0; padding:0; overflow-x:hidden; overscroll-behavior:none;
      color:#2b2a26;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    }
    body{
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
      background-attachment:fixed;
      transition:background .35s ease;
    }
    *{ -webkit-tap-highlight-color:transparent; }

    .card-warm{ background:var(--card); border:1px solid var(--cardBorder); }
    .pill-warm{ background:var(--pillBg); color:var(--pillFg); }
    .btn-dark { background:var(--primary); }
    .input-bg { background:var(--inputBg); }
    .num-badge{ background:var(--numBg); color:var(--numFg); }
    .panel-bg { background:var(--panel); }

    @keyframes popIn{0%{opacity:0;transform:scale(.82) translateY(8px);}60%{opacity:1;transform:scale(1.04) translateY(0);}100%{opacity:1;transform:scale(1);}}
    .pop-in{animation:popIn .42s cubic-bezier(.22,1,.36,1) both;}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    .fade-in{animation:fadeIn .2s ease both;}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
    .slide-up{animation:slideUp .28s cubic-bezier(.22,1,.36,1) both;}
    @keyframes blink{0%,100%{opacity:.55;}50%{opacity:1;}}
    .blink{animation:blink .5s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
    .floating{animation:float 3s ease-in-out infinite;}
  </style>
</head>

<body class="min-h-screen flex flex-col select-none"

    <div class="shrink-0 flex items-center gap-2">

            <polyline points="7 23 3 19 7 15"></polyline>

        </span>
        <span id="toggleText">去哪玩</span>
      </button>

      <button id="openSettings" aria-label="设置"
              class="w-10 h-10 flex items-center justify-center rounded-full card-warm active:scale-90 transition">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>

        </svg>
      </button>
    </div>
  </header>

  <!-- ===== 核心区域 ===== -->
  <main class="flex-1 flex flex-col px-5 pt-2 pb-5 gap-4">
    <div class="card-warm rounded-3xl flex-1 flex flex-col items-center justify-center text-center px-5 py-8 min-h-[240px] shadow-sm gap-5">
      <div id="stage" class="w-full flex items-center justify-center">
        <div class="flex flex-col items-center gap-3">
          <div class="text-6xl floating leading-none">🎲</div>
          <div class="text-3xl font-extrabold text-black/70">还没抽哦</div>
        </div>
      </div>
      <span id="subhint" class="inline-block px-3 py-1 rounded-full pill-warm text-xs font-medium">点击下方按钮开始</span>
    </div>

    <!-- 吃什么：双按钮 -->
    <div id="foodBtns" class="flex gap-3">
      <button data-food="2" class="flex-1 h-14 rounded-full card-warm text-[#2b2a26] text-base font-bold flex items-center justify-center shadow-sm active:scale-[0.97] transition-transform duration-150">抽两家</button>
      <button data-food="1" class="flex-1 h-14 rounded-full btn-dark text-white text-base font-bold flex items-center justify-center shadow-lg shadow-black/10 active:scale-[0.97] transition-transform duration-150">抽一家</button>
    </div>

    <!-- 去哪玩：6 个按钮（文字旁带数量徽标） -->
    <div id="placeBtns" class="hidden grid grid-cols-2 gap-3">
      <button data-cat="suburb"   class="h-14 rounded-2xl card-warm text-[#2b2a26] text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.97] transition">🏞️ 远处郊游</button>
      <button data-cat="nearby"   class="h-14 rounded-2xl card-warm text-[#2b2a26] text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.97] transition">📍 附近玩玩</button>
      <button data-cat="historic" class="h-14 rounded-2xl card-warm text-[#2b2a26] text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.97] transition">🏯 名胜古迹</button>

  </main>

      <button id="clearBtn" class="mt-3 h-11 w-full rounded-2xl input-bg text-sm font-semibold text-black/50 active:scale-[0.98] transition">清空全部</button>
    </div>
  </div>

        <button id="closePlace" aria-label="关闭" class="w-9 h-9 -mr-1 flex items-center justify-center rounded-full pill-warm active:scale-90 transition">

        </button>

      <p id="placeCountLine" class="text-xs text-black/45 mb-2 px-1"></p>
      <!-- 添加 -->
      <div class="flex gap-2 mb-1">
        <input id="placeInput" type="text" inputmode="text" enterkeyhint="done" placeholder="输入地名，可带距离，如：故宫 15.5"

        <button id="addPlace" class="h-11 px-5 rounded-2xl btn-dark text-white text-sm font-semibold active:scale-95 transition">添加</button>
      </div>
      <p class="text-xs text-black/35 mb-3 px-1">多个用换行或逗号分隔；距离可省略。"全部随机"由五类自动去重合并。</p>
      <div id="placeList" class="flex-1 overflow-y-auto -mx-1 px-1 space-y-2" style="-webkit-overflow-scrolling: touch;"></div>
      <button id="clearPlace" class="mt-3 h-11 w-full rounded-2xl input-bg text-sm font-semibold text-black/50 active:scale-[0.98] transition">清空当前分类</button>
    </div>
  </div>

        left.innerHTML='<span class="shrink-0 w-6 h-6 flex items-center justify-center rounded-full num-badge text-xs font-bold">'+(index+1)+'</span><span class="text-xl leading-none">'+getFoodEmoji(name)+'</span>';
        const span=document.createElement('span'); span.className='text-sm font-medium break-all'; span.textContent=name; left.appendChild(span); row.appendChild(left);
        const del=document.createElement('button'); del.className='shrink-0 w-9 h-9 flex items-center justify-center rounded-full text-black/35 active:bg-black/10 active:scale-90 transition'; del.setAttribute('aria-label','删除');
        del.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        del.addEventListener('click',()=>removeRestaurant(index)); row.appendChild(del); listEl.appendChild(row);
      });
    }
    function addRestaurant(){
      const raw=inputEl.value; if(!raw.trim())return;
      const names=raw.split(/[\s\u3000]+/).map(s=>s.trim()).filter(Boolean);
      let added=0; names.forEach(name=>{ if(!pool.includes(name)){ pool.push(name); added++; } });
      if(added>0)savePool(pool); inputEl.value=''; renderList(); renderCount();
    }
    function removeRestaurant(i){ pool.splice(i,1); savePool(pool); renderList(); renderCount(); }
    function clearAll(){ if(pool.length===0)return; if(!confirm('确定清空全部餐厅吗？'))return; pool=[]; savePool(pool); renderList(); renderCount(); }
    function openSettings(){ maskEl.style.display='flex'; maskEl.classList.add('fade-in'); renderList(); }
    function closeSettings(){ maskEl.style.display='none'; }

    /* ==================== 地名管理 ==================== */
    function renderPlaceTabs(){
      placeTabs.innerHTML='';
      PLACE_CATS.forEach(k=>{
        const b=document.createElement('button');
        const active=k===editCat;
        b.className='px-3 h-9 rounded-full text-sm font-bold transition active:scale-95 '+(active?'btn-dark text-white':'pill-warm');
        b.textContent=PLACE_LABELS[k]+' '+PLACE_LIB[k].length;
        b.addEventListener('click',()=>{ editCat=k; renderPlaceTabs(); renderPlaceList(); });
        placeTabs.appendChild(b);
      });
      placeCountLine.textContent='当前「'+PLACE_LABELS[editCat]+'」'+PLACE_LIB[editCat].length+' 个 · 全部随机去重后共 '+PLACE_LIB.all.length+' 个';
    }
    function renderPlaceList(){
      placeList.innerHTML='';
      const lib=PLACE_LIB[editCat];
      if(lib.length===0){ placeList.innerHTML='<p class="text-center text-black/30 text-sm py-10">该分类还没有地名，添加一个吧 👆</p>'; return; }
      lib.forEach((it,index)=>{
        const row=document.createElement('div'); row.className='input-bg rounded-2xl flex items-center justify-between pl-3 pr-2 py-2.5';
        const left=document.createElement('div'); left.className='flex items-center gap-2 min-w-0';
        left.innerHTML='<span class="shrink-0 w-6 h-6 flex items-center justify-center rounded-full num-badge text-xs font-bold">'+(index+1)+'</span><span class="text-xl leading-none">'+getPlaceEmoji(it.name)+'</span>';
        const span=document.createElement('span'); span.className='text-sm font-medium break-all';
        span.innerHTML=escapeHTML(it.name)+(it.dist!=null?'<span class="text-black/35 font-normal"> · '+it.dist+'km</span>':'');
        left.appendChild(span); row.appendChild(left);
        const del=document.createElement('button'); del.className='shrink-0 w-9 h-9 flex items-center justify-center rounded-full text-black/35 active:bg-black/10 active:scale-90 transition'; del.setAttribute('aria-label','删除');
        del.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        del.addEventListener('click',()=>removePlace(index)); row.appendChild(del); placeList.appendChild(row);
      });
    }
    // 添加地名：换行 / 逗号（，,）分隔，每条结尾数字视为距离
    function addPlace(){
      const raw=placeInput.value; if(!raw.trim())return;
      const parts=raw.split(/[\n,，]+/).map(s=>s.trim()).filter(Boolean);
      const exist=new Set(PLACE_LIB[editCat].map(x=>x.name));
      let added=0;
      parts.forEach(p=>{ const e=parseEntry(p); if(e.name&&!exist.has(e.name)){ PLACE_LIB[editCat].push(e); exist.add(e.name); added++; } });
      if(added>0){ savePlaces(); rebuildAll(); updatePlaceCounts(); }
      placeInput.value=''; renderPlaceTabs(); renderPlaceList();
    }
    function removePlace(i){ PLACE_LIB[editCat].splice(i,1); savePlaces(); rebuildAll(); updatePlaceCounts(); renderPlaceTabs(); renderPlaceList(); }
    function clearPlaceCat(){
      if(PLACE_LIB[editCat].length===0)return;
      if(!confirm('确定清空「'+PLACE_LABELS[editCat]+'」全部地名吗？'))return;
      PLACE_LIB[editCat]=[]; savePlaces(); rebuildAll(); updatePlaceCounts(); renderPlaceTabs(); renderPlaceList();
    }
    function openPlaceSettings(){ placeMask.style.display='flex'; placeMask.classList.add('fade-in'); renderPlaceTabs(); renderPlaceList(); }
    function closePlaceSettings(){ placeMask.style.display='none'; }

    /* ==================== 事件绑定 ==================== */
    foodBtns.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>pickFood(parseInt(b.dataset.food,10))));
    placeBtns.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>pickPlace(b.dataset.cat)));
    toggleModeBtn.addEventListener('click',()=>switchMode(currentMode==='food'?'place':'food'));
    // 设置按钮按当前模式打开对应设置
    openSettingsBtn.addEventListener('click',()=>{ currentMode==='place'?openPlaceSettings():openSettings(); });
    document.getElementById('closeSettings').addEventListener('click',closeSettings);
    document.getElementById('addBtn').addEventListener('click',addRestaurant);
    document.getElementById('clearBtn').addEventListener('click',clearAll);
    inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter')addRestaurant(); });
    maskEl.addEventListener('click',e=>{ if(e.target===maskEl)closeSettings(); });
    document.getElementById('closePlace').addEventListener('click',closePlaceSettings);
    document.getElementById('addPlace').addEventListener('click',addPlace);
    document.getElementById('clearPlace').addEventListener('click',clearPlaceCat);
    placeInput.addEventListener('keydown',e=>{ if(e.key==='Enter')addPlace(); });
    placeMask.addEventListener('click',e=>{ if(e.target===placeMask)closePlaceSettings(); });

    /* ==================== 初始化 ==================== */
    if(localStorage.getItem(STORAGE_KEY)===null)savePool(pool);
    renderCount(); updatePlaceCounts();
  </script>
</body>
</html>
